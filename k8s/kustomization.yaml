# Apply everything with:  kubectl apply -k k8s/
#
# The Secret is NOT in git. Create it once from your env file:
#   kubectl create namespace peerproject
#   kubectl -n peerproject create secret generic peerproject-backend-env \
#     --from-env-file=App/.env
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: peerproject

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  - name: peerproject-backend
    newName: ghcr.io/shyzen15/the-peer-project-backend
    newTag: v3
